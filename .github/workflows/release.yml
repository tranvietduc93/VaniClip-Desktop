
name: Build and Release VaniClip

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: vaniclip-release
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check version
        shell: bash
        run: |
          echo "Building VaniClip $(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: vaniclip-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7


  build-macos:
    name: Build macOS Intel and Universal
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Prepare output folder
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p mac-release

      - name: Build macOS Intel x64 (unsigned)
        run: |
          npx electron-builder --mac dmg --x64 --publish never
          cp release/*.dmg "mac-release/VaniClip-${VERSION}-x64.dmg"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Clean build output
        run: rm -rf release/*

      - name: Build macOS Universal (unsigned)
        run: npx electron-builder --mac dmg zip --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Save Universal installer and updater files
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== ALL RELEASE FILES ====="
          find release -maxdepth 2 -type f -print

          echo "===== CHECK UNIVERSAL FILES ====="
          test -f "release/VaniClip-${VERSION}-universal.dmg"
          test -f "release/VaniClip-${VERSION}-universal-mac.zip"

          mkdir -p mac-release

          cp "release/VaniClip-${VERSION}-universal.dmg" mac-release/
          cp "release/VaniClip-${VERSION}-universal-mac.zip" mac-release/
          cp release/latest-mac.yml mac-release/
          cp release/*.blockmap mac-release/

          echo "===== COPIED FILES ====="
          find mac-release -maxdepth 1 -type f -print

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: vaniclip-macos
          path: mac-release/*
          if-no-files-found: error
          retention-days: 7


  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows files
        uses: actions/download-artifact@v4
        with:
          name: vaniclip-windows
          path: release

      - name: Download macOS files
        uses: actions/download-artifact@v4
        with:
          name: vaniclip-macos
          path: release

      - name: Set version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify release files
        shell: bash
        run: |
          echo "Release files:"
          find release -maxdepth 1 -type f -print

          test -n "$(find release -maxdepth 1 -name '*.exe' -print -quit)"
          test -f release/latest.yml
          test -f "release/VaniClip-${VERSION}-x64.dmg"
          test -f "release/VaniClip-${VERSION}-universal.dmg"
          test -n "$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -f release/latest-mac.yml
